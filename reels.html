<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Reels — PLAYVERSE | Trailers</title>
<meta name="theme-color" content="#000000">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000;
  --text: #fff;
  --muted: #a1a1aa;
  --accent: #2f81f7;
  --like: #ff2d55;
  --font: "Inter", system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
.top {
  position: fixed; top: 0; left: 0; right: 0; z-index: 40;
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px;
  background: linear-gradient(to bottom, rgba(0,0,0,.75), transparent);
  pointer-events: none;
}
.top a, .top button {
  pointer-events: auto;
  color: #fff; text-decoration: none; font-size: 13px; font-weight: 700;
  background: rgba(255,255,255,.12); border: 0; border-radius: 100px;
  padding: 8px 12px; cursor: pointer; font-family: inherit;
}
.top .brand { background: transparent; font-size: 14px; letter-spacing: -0.02em; }
.top .brand span { color: #60a5fa; }

.feed {
  height: 100%;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
}
.reel {
  position: relative;
  height: 100%;
  height: 100dvh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  background: #0a0a0a;
  display: flex; align-items: center; justify-content: center;
}
.reel iframe {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  border: 0;
  pointer-events: none;
}
.reel.active iframe { pointer-events: auto; }

.reel-cover {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  filter: brightness(.55);
}
.reel-cover::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,.85) 0%, transparent 45%, rgba(0,0,0,.35) 100%);
}

.side {
  position: absolute; right: 10px; bottom: 120px; z-index: 5;
  display: flex; flex-direction: column; align-items: center; gap: 16px;
}
.side button {
  width: 48px; height: 48px; border-radius: 50%;
  border: 0; background: rgba(0,0,0,.35);
  color: #fff; font-size: 22px; cursor: pointer;
  display: grid; place-items: center;
  backdrop-filter: blur(6px);
}
.side button.liked { color: var(--like); }
.side .count {
  font-size: 12px; font-weight: 700; margin-top: -10px;
  text-shadow: 0 1px 4px #000;
}
.side a {
  width: 48px; height: 48px; border-radius: 50%;
  background: rgba(0,0,0,.35); color: #fff;
  display: grid; place-items: center; text-decoration: none; font-size: 18px;
}

.meta {
  position: absolute; left: 14px; right: 70px; bottom: 28px; z-index: 5;
}
.meta .genre {
  display: inline-block; font-size: 11px; font-weight: 700;
  background: rgba(47,129,247,.85); padding: 3px 8px; border-radius: 4px;
  margin-bottom: 8px;
}
.meta h2 {
  font-size: 1.15rem; font-weight: 800; letter-spacing: -0.02em;
  margin-bottom: 6px; text-shadow: 0 2px 8px #000;
}
.meta p {
  font-size: 13px; color: #e4e4e7; line-height: 1.4;
  max-height: 3.2em; overflow: hidden;
  text-shadow: 0 1px 6px #000;
}
.play-hint {
  position: absolute; inset: 0; z-index: 3;
  display: grid; place-items: center;
  background: transparent; border: 0; cursor: pointer;
  color: #fff; font-size: 64px; opacity: .85;
}
.play-hint.hide { display: none; }

.empty {
  height: 100dvh; display: grid; place-items: center;
  text-align: center; padding: 2rem; color: var(--muted);
}
.empty a { color: #60a5fa; }

.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: rgba(24,24,27,.95); border: 1px solid #3f3f46;
  color: #fff; padding: 10px 16px; border-radius: 100px;
  font-size: 13px; font-weight: 600; z-index: 50;
  display: none;
}
.toast.on { display: block; }
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="index.html">PLAYVERSE <span>Reels</span></a>
  <div style="display:flex;gap:8px">
    <a href="index.html">Jogos</a>
    <a href="auth.html" id="authLink">Conta</a>
  </div>
</header>

<div class="feed" id="feed">
  <div class="empty">A carregar trailers…</div>
</div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBHd-zh1MWL6bD5Ptu3vp62XKMawlRfDQI",
  authDomain: "playverse-4af2d.firebaseapp.com",
  projectId: "playverse-4af2d",
  appId: "1:1054190266087:web:86c1c0572eec16eff66442"
};

const RAWG_KEY = localStorage.getItem("pv_rawg_key") || "47531b491b544f4fa2bd5588869d9402";
const YT_KEY = localStorage.getItem("pv_youtube_key") || "AIzaSyCVksGDDofV4R9ujngyoH43Licwk9X9I8Y";
const SESSION = "pv_user_session";
const PREFS = "pv_user_prefs";

let db = null;
let auth = null;
let currentUser = null;

function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("on"), 2200);
}

function getSession(){
  try { return JSON.parse(localStorage.getItem(SESSION) || "null"); }
  catch(e){ return null; }
}
function prefsKey(){
  const u = getSession();
  return PREFS + (u && u.uid ? ("_" + u.uid) : "_guest");
}
function loadPrefs(){
  try {
    const p = JSON.parse(localStorage.getItem(prefsKey()) || "null");
    if(p && p.genres) return p;
  } catch(e){}
  return { likes: [], genres: {}, watched: [] };
}
function topGenres(){
  const g = loadPrefs().genres || {};
  return Object.keys(g).sort((a,b) => g[b] - g[a]);
}

function initFirebase(){
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    auth = firebase.auth();
    db = firebase.firestore();
    auth.onAuthStateChanged(u => {
      currentUser = u;
      const link = document.getElementById("authLink");
      if(u) link.textContent = (u.displayName || "Conta").split(" ")[0];
    });
  } catch(e) {
    console.warn(e);
    toast("Firebase offline — likes globais indisponíveis");
  }
}

/* Global like counts in Firestore: collection reelLikes / doc = gameKey */
async function getGlobalCount(gameKey){
  if(!db) return 0;
  try {
    const snap = await db.collection("reelLikes").doc(gameKey).get();
    if(snap.exists) return snap.data().count || 0;
  } catch(e){ console.warn(e); }
  return 0;
}

async function hasUserLiked(gameKey, uid){
  if(!db || !uid) return false;
  try {
    const snap = await db.collection("reelLikes").doc(gameKey).collection("users").doc(uid).get();
    return snap.exists;
  } catch(e){ return false; }
}

async function toggleGlobalLike(gameKey, btn, countEl){
  const session = getSession();
  if(!session || !session.uid){
    if(confirm("Entra na tua conta para o like ser visível a todos.\nAbrir Conta?")) location.href = "auth.html";
    return;
  }
  if(!db){
    toast("Likes globais precisam do Firestore ativo");
    return;
  }
  const uid = session.uid;
  const ref = db.collection("reelLikes").doc(gameKey);
  const userRef = ref.collection("users").doc(uid);
  try {
    const liked = await hasUserLiked(gameKey, uid);
    await db.runTransaction(async (tx) => {
      const doc = await tx.get(ref);
      let count = doc.exists ? (doc.data().count || 0) : 0;
      if(liked){
        tx.delete(userRef);
        count = Math.max(0, count - 1);
        tx.set(ref, { count, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
      } else {
        tx.set(userRef, { at: firebase.firestore.FieldValue.serverTimestamp() });
        count = count + 1;
        tx.set(ref, { count, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
      }
    });
    const nowLiked = !liked;
    btn.classList.toggle("liked", nowLiked);
    btn.textContent = nowLiked ? "♥" : "♡";
    const c = await getGlobalCount(gameKey);
    countEl.textContent = formatCount(c);
    toast(nowLiked ? "Like global · todos podem ver" : "Like removido");
  } catch(e) {
    console.warn(e);
    toast("Ativa Firestore no Firebase (ver instruções)");
  }
}

function formatCount(n){
  if(n >= 1000000) return (n/1000000).toFixed(1).replace(/\.0$/,"") + "M";
  if(n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,"") + "K";
  return String(n);
}

async function rawgGames(){
  const genres = topGenres();
  const urls = [
    "https://api.rawg.io/api/games?ordering=-metacritic&page_size=20&metacritic=80,100&key=" + encodeURIComponent(RAWG_KEY),
    "https://api.rawg.io/api/games?ordering=-rating&page_size=20&metacritic=75,100&key=" + encodeURIComponent(RAWG_KEY)
  ];
  if(genres[0]){
    // search by preferred genre name in query
    urls.unshift("https://api.rawg.io/api/games?search=" + encodeURIComponent(genres[0]) + "&page_size=15&key=" + encodeURIComponent(RAWG_KEY));
  }
  const seen = new Set();
  const out = [];
  for(const url of urls){
    try {
      const r = await fetch(url);
      if(!r.ok) continue;
      const d = await r.json();
      for(const g of (d.results || [])){
        if(!g.id || seen.has(g.id) || !g.background_image) continue;
        if(String(g.released||"").slice(0,4) >= "2030") continue;
        seen.add(g.id);
        out.push({
          id: "rawg-" + g.id,
          rawgId: g.id,
          title: g.name,
          image: g.background_image,
          genre: (g.genres || []).map(x => x.name),
          rating: g.rating,
          year: g.released ? g.released.slice(0,4) : ""
        });
      }
    } catch(e){}
  }
  // personalize order
  const prefs = loadPrefs().genres || {};
  out.sort((a,b) => {
    const sa = (a.genre||[]).reduce((s,g)=>s+(prefs[g]||0),0);
    const sb = (b.genre||[]).reduce((s,g)=>s+(prefs[g]||0),0);
    return sb - sa;
  });
  return out.slice(0, 24);
}

async function youtubeTrailer(title){
  if(!YT_KEY || !title) return "";
  try {
    const q = encodeURIComponent(title + " official trailer");
    const url = "https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=1&videoEmbeddable=true&q=" + q + "&key=" + encodeURIComponent(YT_KEY);
    const r = await fetch(url);
    if(!r.ok) return "";
    const d = await r.json();
    return (d.items && d.items[0] && d.items[0].id && d.items[0].id.videoId) || "";
  } catch(e){ return ""; }
}

async function buildFeed(){
  const feed = document.getElementById("feed");
  const games = await rawgGames();
  if(!games.length){
    feed.innerHTML = '<div class="empty">Sem trailers de momento.<br><a href="index.html">Voltar ao catálogo</a></div>';
    return;
  }
  feed.innerHTML = "";
  for(let i = 0; i < games.length; i++){
    const g = games[i];
    const reel = document.createElement("section");
    reel.className = "reel" + (i === 0 ? " active" : "");
    reel.dataset.id = g.id;
    const genre = (g.genre && g.genre[0]) || "Jogos";
    reel.innerHTML =
      '<div class="reel-cover" style="background-image:url(\'' + g.image.replace(/'/g, "%27") + '\')"></div>' +
      '<div class="side">' +
        '<button type="button" class="like-btn" data-key="' + g.id + '" aria-label="Gosto">♡</button>' +
        '<span class="count" data-count-for="' + g.id + '">0</span>' +
        '<a href="index.html" title="Catálogo">🎮</a>' +
      '</div>' +
      '<div class="meta">' +
        '<span class="genre">' + genre + '</span>' +
        '<h2></h2><p></p>' +
      '</div>' +
      '<button type="button" class="play-hint" data-play>▶</button>';
    reel.querySelector("h2").textContent = g.title;
    reel.querySelector("p").textContent = (g.year ? g.year + " · " : "") + (g.genre || []).slice(0,3).join(" · ") + (g.rating ? " · ★ " + g.rating : "");
    feed.appendChild(reel);

    // load trailer lazily
    (async () => {
      const vid = await youtubeTrailer(g.title);
      if(vid){
        reel.dataset.video = vid;
        const cover = reel.querySelector(".reel-cover");
        // keep cover until play
      }
      // global count
      const c = await getGlobalCount(g.id);
      const countEl = reel.querySelector("[data-count-for]");
      if(countEl) countEl.textContent = formatCount(c);
      const session = getSession();
      if(session && session.uid){
        const liked = await hasUserLiked(g.id, session.uid);
        const btn = reel.querySelector(".like-btn");
        if(liked && btn){ btn.classList.add("liked"); btn.textContent = "♥"; }
      }
    })();
  }

  // YouTube API players per reel
  window._ytPlayers = window._ytPlayers || {};
  window._audioUnlocked = false;

  function unlockAudioOnce(){
    window._audioUnlocked = true;
  }
  document.body.addEventListener("touchstart", unlockAudioOnce, { once: true, passive: true });
  document.body.addEventListener("click", unlockAudioOnce, { once: true });

  function stopAllExcept(exceptReel){
    feed.querySelectorAll(".reel").forEach(r => {
      if(r === exceptReel) return;
      const pid = r.dataset.playerId;
      const p = pid && window._ytPlayers[pid];
      if(p && p.pauseVideo) try { p.pauseVideo(); } catch(e){}
      const ifr = r.querySelector("iframe");
      // keep iframe but paused via API
      r.classList.remove("active");
    });
  }

  function ensurePlayer(reel){
    const vid = reel.dataset.video;
    if(!vid) return null;
    if(reel.dataset.playerId && window._ytPlayers[reel.dataset.playerId]){
      return window._ytPlayers[reel.dataset.playerId];
    }
    let mount = reel.querySelector(".yt-mount");
    if(!mount){
      mount = document.createElement("div");
      mount.className = "yt-mount";
      mount.id = "yt_" + reel.dataset.id.replace(/[^a-z0-9]/gi, "_");
      mount.style.cssText = "position:absolute;inset:0;width:100%;height:100%;";
      reel.appendChild(mount);
    }
    if(typeof YT === "undefined" || !YT.Player){
      // fallback iframe autoplay with sound
      if(!reel.querySelector("iframe")){
        const ifr = document.createElement("iframe");
        ifr.src = "https://www.youtube-nocookie.com/embed/" + vid + "?autoplay=1&mute=0&playsinline=1&rel=0&modestbranding=1&enablejsapi=1";
        ifr.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen";
        ifr.allowFullscreen = true;
        ifr.style.cssText = "position:absolute;inset:0;width:100%;height:100%;border:0;";
        reel.appendChild(ifr);
      }
      const hint = reel.querySelector("[data-play]");
      if(hint) hint.classList.add("hide");
      const cover = reel.querySelector(".reel-cover");
      if(cover) cover.style.opacity = "0";
      return null;
    }
    const player = new YT.Player(mount.id, {
      videoId: vid,
      width: "100%",
      height: "100%",
      playerVars: {
        autoplay: 1,
        mute: 0,
        playsinline: 1,
        rel: 0,
        modestbranding: 1,
        controls: 1,
        origin: location.origin
      },
      events: {
        onReady: function(e){
          try {
            e.target.unMute();
            e.target.setVolume(100);
            e.target.playVideo();
          } catch(err){}
        },
        onStateChange: function(e){
          // if ended, optional: could scroll next
        },
        onError: function(){}
      }
    });
    reel.dataset.playerId = mount.id;
    window._ytPlayers[mount.id] = player;
    const hint = reel.querySelector("[data-play]");
    if(hint) hint.classList.add("hide");
    const cover = reel.querySelector(".reel-cover");
    if(cover) cover.style.opacity = "0";
    return player;
  }

  function playReel(reel){
    if(!reel) return;
    stopAllExcept(reel);
    reel.classList.add("active");
    if(!reel.dataset.video){
      toast("A carregar trailer…");
      return;
    }
    const player = ensurePlayer(reel);
    if(player && player.playVideo){
      try {
        player.unMute();
        player.setVolume(100);
        player.playVideo();
      } catch(e){}
    }
  }

  // events
  feed.querySelectorAll(".like-btn").forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      unlockAudioOnce();
      const key = btn.dataset.key;
      const countEl = feed.querySelector('[data-count-for="' + key + '"]');
      toggleGlobalLike(key, btn, countEl);
    };
  });

  feed.querySelectorAll("[data-play]").forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      unlockAudioOnce();
      playReel(btn.closest(".reel"));
    };
  });

  // Autoplay on scroll (with sound when browser allows)
  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if(en.isIntersecting && en.intersectionRatio >= 0.65){
        playReel(en.target);
      } else if(!en.isIntersecting){
        const pid = en.target.dataset.playerId;
        const p = pid && window._ytPlayers[pid];
        if(p && p.pauseVideo) try { p.pauseVideo(); } catch(e){}
      }
    });
  }, { threshold: [0.65, 0.9] });
  feed.querySelectorAll(".reel").forEach(r => io.observe(r));

  // first reel attempt after short delay (needs video id loaded)
  setTimeout(() => {
    const first = feed.querySelector(".reel");
    if(first && first.dataset.video) playReel(first);
  }, 1500);
}

// Load YouTube IFrame API
if(!document.getElementById("ytApiScript")){
  const s = document.createElement("script");
  s.id = "ytApiScript";
  s.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(s);
}
window.onYouTubeIframeAPIReady = function(){
  window._ytReady = true;
};


initFirebase();
buildFeed();
</script>
</body>
</html>
