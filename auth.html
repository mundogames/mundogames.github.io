<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conta — PLAYVERSE | Mundogames</title>
<meta name="description" content="Criar conta ou entrar no PLAYVERSE — personaliza o teu feed de jogos.">
<meta name="theme-color" content="#0d1117">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface-2: #1c2129;
  --surface-3: #21262d;
  --border: #30363d;
  --text: #e6edf3;
  --text-secondary: #8b949e;
  --text-muted: #6e7681;
  --accent: #2f81f7;
  --success: #16a34a;
  --danger: #f85149;
  --radius: 10px;
  --font: "Inter", system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { width: min(420px, 100% - 2rem); margin: 0 auto; }

.top {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 0; max-width: 960px; margin: 0 auto; width: calc(100% - 2rem);
}
.brand {
  font-weight: 800; font-size: 15px; color: var(--text); text-decoration: none;
  display: flex; align-items: center; gap: 8px;
}
.brand-badge {
  background: var(--accent); color: #fff; font-size: 10px; font-weight: 700;
  padding: 2px 6px; border-radius: 3px;
}
.top-links { display: flex; gap: 12px; font-size: 13px; }
.top-links a { color: var(--text-secondary); text-decoration: none; }
.top-links a:hover { color: var(--text); }

.hero-note {
  text-align: center; padding: 8px 0 20px;
  color: var(--text-secondary); font-size: 13px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 1.5rem 1.35rem 1.6rem;
  box-shadow: 0 16px 40px rgba(0,0,0,.35);
}
.tabs {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  background: var(--surface-2); padding: 4px; border-radius: 10px;
  margin-bottom: 1.25rem;
}
.tab {
  border: 0; background: transparent; color: var(--text-secondary);
  font-weight: 700; font-size: 13px; padding: 10px; border-radius: 8px;
  cursor: pointer; font-family: inherit;
}
.tab.on {
  background: var(--surface-3); color: var(--text);
  box-shadow: 0 0 0 1px var(--border);
}
h1 {
  font-size: 1.25rem; font-weight: 800; letter-spacing: -0.03em;
  margin-bottom: 4px;
}
.sub { font-size: 13px; color: var(--text-muted); margin-bottom: 1.1rem; }

label {
  display: block; font-size: 12px; font-weight: 600;
  color: var(--text-secondary); margin: 12px 0 6px;
}
input {
  width: 100%; padding: 12px 14px;
  border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text);
  font-size: 15px; font-family: inherit; outline: none;
}
input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(47,129,247,.2); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 12px 16px; margin-top: 14px;
  border-radius: 8px; border: 1px solid transparent;
  font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
  text-decoration: none;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { filter: brightness(1.08); }
.btn-primary:disabled { opacity: .55; cursor: not-allowed; }
.btn-ghost {
  background: var(--surface-3); color: var(--text); border-color: var(--border);
}
.btn-ghost:hover { background: var(--border); color: var(--text); text-decoration: none; }
.btn-google {
  background: #fff; color: #111; border-color: #ddd; margin-top: 10px;
}
.btn-google:hover { filter: brightness(.97); text-decoration: none; }

.divider {
  display: flex; align-items: center; gap: 10px;
  margin: 16px 0 4px; color: var(--text-muted); font-size: 11px; font-weight: 600;
}
.divider::before, .divider::after {
  content: ""; flex: 1; height: 1px; background: var(--border);
}

.msg {
  display: none; margin-top: 12px; padding: 10px 12px; border-radius: 8px;
  font-size: 13px; line-height: 1.4;
}
.msg.err { display: block; background: rgba(248,81,73,.12); border: 1px solid rgba(248,81,73,.35); color: #ffa198; }
.msg.ok { display: block; background: rgba(22,163,74,.12); border: 1px solid rgba(22,163,74,.35); color: #4ade80; }

.panel { display: none; }
.panel.on { display: block; }

.session {
  display: none; text-align: center; padding: 8px 0 4px;
}
.session.on { display: block; }
.avatar {
  width: 64px; height: 64px; border-radius: 50%;
  background: linear-gradient(135deg, #2f81f7, #16a34a);
  display: grid; place-items: center; margin: 0 auto 12px;
  font-weight: 800; font-size: 22px; color: #fff;
}
.session h2 { font-size: 1.1rem; margin-bottom: 4px; }
.session p { font-size: 13px; color: var(--text-secondary); margin-bottom: 14px; word-break: break-all; }

.hint {
  margin-top: 1.25rem; padding: 12px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 8px; font-size: 12px; color: var(--text-muted); line-height: 1.5;
}
.hint strong { color: var(--text-secondary); }

.footer {
  text-align: center; padding: 2rem 1rem;
  font-size: 12px; color: var(--text-muted);
}
</style>
</head>
<body>

<div class="top">
  <a class="brand" href="index.html">PLAYVERSE <span class="brand-badge">Store</span></a>
  <div class="top-links">
    <a href="index.html">Jogos</a>
    <a href="noticias.html">Notícias</a>
  </div>
</div>

<p class="hero-note">Entra ou cria a tua conta PLAYVERSE</p>

<div class="wrap">

  <!-- Logged in -->
  <div class="card session" id="sessionCard">
    <div class="avatar" id="userAvatar">P</div>
    <h2 id="userName">Utilizador</h2>
    <p id="userEmail"></p>
    <a class="btn btn-primary" href="index.html">Ir para o catálogo</a>
    <a class="btn btn-ghost" href="noticias.html">Ver notícias</a>
    <button type="button" class="btn btn-ghost" id="btnLogout" style="margin-top:8px">Terminar sessão</button>
  </div>

  <!-- Auth forms -->
  <div class="card" id="authCard">
    <div class="tabs">
      <button type="button" class="tab on" data-tab="login">Entrar</button>
      <button type="button" class="tab" data-tab="register">Criar conta</button>
    </div>

    <div class="panel on" id="panel-login">
      <h1>Entrar</h1>
      <p class="sub">Acede à tua conta PLAYVERSE</p>
      <form id="formLogin">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" autocomplete="email" required placeholder="o.teu@email.com">
        <label for="loginPass">Palavra-passe</label>
        <input id="loginPass" type="password" autocomplete="current-password" required minlength="6" placeholder="Mínimo 6 caracteres">
        <button class="btn btn-primary" type="submit" id="btnLogin">Entrar</button>
      </form>
    </div>

    <div class="panel" id="panel-register">
      <h1>Criar conta</h1>
      <p class="sub">Registo grátis · só precisas de email</p>
      <form id="formRegister">
        <label for="regName">Nome</label>
        <input id="regName" type="text" autocomplete="name" required placeholder="O teu nome" maxlength="40">
        <label for="regEmail">Email</label>
        <input id="regEmail" type="email" autocomplete="email" required placeholder="o.teu@email.com">
        <label for="regPass">Palavra-passe</label>
        <input id="regPass" type="password" autocomplete="new-password" required minlength="6" placeholder="Mínimo 6 caracteres">
        <button class="btn btn-primary" type="submit" id="btnRegister">Criar conta</button>
      </form>
    </div>

    <div class="divider">OU</div>
    <button type="button" class="btn btn-google" id="btnGoogle">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3.1l5.7-5.7C34.2 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.5-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 12 24 12c3.1 0 5.8 1.2 8 3.1l5.7-5.7C34.2 6.1 29.3 4 24 4 16.3 4 9.5 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.3 35.3 26.8 36 24 36c-5.3 0-9.7-3.1-11.3-7.5l-6.5 5C9.4 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.2-3.5 5.7-6.5 7.1l.1.1 6.2 5.2C36.8 41.4 44 36 44 24c0-1.3-.1-2.5-.4-3.5z"/></svg>
      Continuar com Google
    </button>

    <div class="msg" id="msg"></div>

    </div>
</div>

<div class="footer">© 2026 PLAYVERSE / Mundogames.co.mz</div>

<!-- Firebase SDKs (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script>
/* config */
const FIREBASE_CONFIG = {
  apiKey: localStorage.getItem("pv_firebase_apiKey") || "AIzaSyBHd-zh1MWL6bD5Ptu3vp62XKMawlRfDQI",
  authDomain: localStorage.getItem("pv_firebase_authDomain") || "playverse-4af2d.firebaseapp.com",
  projectId: localStorage.getItem("pv_firebase_projectId") || "playverse-4af2d",
  appId: localStorage.getItem("pv_firebase_appId") || "1:1054190266087:web:86c1c0572eec16eff66442"
};

const SESSION_KEY = "pv_user_session";
let auth = null;
let usingFirebase = false;

function showMsg(text, ok){
  const el = document.getElementById("msg");
  el.className = "msg " + (ok ? "ok" : "err");
  el.textContent = text;
}
function clearMsg(){ const el = document.getElementById("msg"); el.className = "msg"; el.textContent = ""; }

function saveSession(user){
  const data = {
    uid: user.uid,
    email: user.email || "",
    name: user.displayName || user.name || (user.email || "Jogador").split("@")[0],
    provider: user.providerId || user.provider || "email",
    ts: Date.now()
  };
  localStorage.setItem(SESSION_KEY, JSON.stringify(data));
  // perfil para recomendações futuras (fase 2)
  if(!localStorage.getItem("pv_user_prefs")){
    localStorage.setItem("pv_user_prefs", JSON.stringify({ likes: [], genres: [], watched: [] }));
  }
  return data;
}

function clearSession(){
  localStorage.removeItem(SESSION_KEY);
}

function getSession(){
  try { return JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); }
  catch(e){ return null; }
}

function renderSession(user){
  const authCard = document.getElementById("authCard");
  const sessionCard = document.getElementById("sessionCard");
  if(!user){
    authCard.style.display = "";
    sessionCard.classList.remove("on");
    return;
  }
  authCard.style.display = "none";
  sessionCard.classList.add("on");
  document.getElementById("userName").textContent = user.name || "Jogador";
  document.getElementById("userEmail").textContent = user.email || user.uid;
  document.getElementById("userAvatar").textContent = (user.name || "P").charAt(0).toUpperCase();
}

/* ----- Tabs ----- */
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("on"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("on"));
    tab.classList.add("on");
    document.getElementById("panel-" + tab.dataset.tab).classList.add("on");
    clearMsg();
  });
});

/* ----- Local demo auth (sem Firebase) ----- */
function localUsers(){
  try { return JSON.parse(localStorage.getItem("pv_local_users") || "{}"); }
  catch(e){ return {}; }
}
function saveLocalUsers(map){
  localStorage.setItem("pv_local_users", JSON.stringify(map));
}

async function localRegister(name, email, pass){
  const users = localUsers();
  const key = email.toLowerCase();
  if(users[key]) throw new Error("Já existe uma conta com este email.");
  users[key] = { name, email: key, pass }; // demo local only
  saveLocalUsers(users);
  return saveSession({ uid: "local_" + btoa(key).slice(0,12), email: key, displayName: name, provider: "local" });
}
async function localLogin(email, pass){
  const users = localUsers();
  const key = email.toLowerCase();
  const u = users[key];
  if(!u || u.pass !== pass) throw new Error("Email ou palavra-passe incorretos.");
  return saveSession({ uid: "local_" + btoa(key).slice(0,12), email: key, displayName: u.name, provider: "local" });
}

/* ----- Firebase init ----- */
function initFirebase(){
  const cfg = FIREBASE_CONFIG;
  if(!cfg.apiKey || !cfg.projectId){
    usingFirebase = false;
    /* modo interno — não mostrar ao público */
    return;
  }
  try{
    firebase.initializeApp(cfg);
    auth = firebase.auth();
    usingFirebase = true;
    
    auth.onAuthStateChanged(u => {
      if(u){
        renderSession(saveSession({
          uid: u.uid,
          email: u.email,
          displayName: u.displayName,
          providerId: (u.providerData[0] && u.providerData[0].providerId) || "firebase"
        }));
      } else if(!getSession() || String(getSession().uid||"").startsWith("local_")){
        // keep local session if any
        const s = getSession();
        if(s && String(s.uid).startsWith("local_")) renderSession(s);
        else renderSession(null);
      }
    });
  }catch(e){
    console.warn(e);
    usingFirebase = false;
    
  }
}

/* ----- Forms ----- */
document.getElementById("formLogin").addEventListener("submit", async (e) => {
  e.preventDefault();
  clearMsg();
  const email = document.getElementById("loginEmail").value.trim();
  const pass = document.getElementById("loginPass").value;
  const btn = document.getElementById("btnLogin");
  btn.disabled = true;
  try{
    if(usingFirebase && auth){
      const cred = await auth.signInWithEmailAndPassword(email, pass);
      renderSession(saveSession({
        uid: cred.user.uid,
        email: cred.user.email,
        displayName: cred.user.displayName,
        providerId: "password"
      }));
    } else {
      renderSession(await localLogin(email, pass));
    }
    showMsg("Sessão iniciada.", true);
  }catch(err){
    showMsg(err.message || "Falha ao entrar.", false);
  }finally{
    btn.disabled = false;
  }
});

document.getElementById("formRegister").addEventListener("submit", async (e) => {
  e.preventDefault();
  clearMsg();
  const name = document.getElementById("regName").value.trim();
  const email = document.getElementById("regEmail").value.trim();
  const pass = document.getElementById("regPass").value;
  const btn = document.getElementById("btnRegister");
  btn.disabled = true;
  try{
    if(usingFirebase && auth){
      const cred = await auth.createUserWithEmailAndPassword(email, pass);
      await cred.user.updateProfile({ displayName: name });
      renderSession(saveSession({
        uid: cred.user.uid,
        email: cred.user.email,
        displayName: name,
        providerId: "password"
      }));
    } else {
      renderSession(await localRegister(name, email, pass));
    }
    showMsg("Conta criada com sucesso.", true);
  }catch(err){
    showMsg(err.message || "Falha ao criar conta.", false);
  }finally{
    btn.disabled = false;
  }
});

document.getElementById("btnGoogle").addEventListener("click", async () => {
  clearMsg();
  if(!usingFirebase || !auth){
    showMsg("Google Login precisa do Firebase configurado (ver instruções abaixo).", false);
    return;
  }
  try{
    const provider = new firebase.auth.GoogleAuthProvider();
    const cred = await auth.signInWithPopup(provider);
    renderSession(saveSession({
      uid: cred.user.uid,
      email: cred.user.email,
      displayName: cred.user.displayName,
      providerId: "google.com"
    }));
    showMsg("Entraste com Google.", true);
  }catch(err){
    showMsg(err.message || "Google Login falhou.", false);
  }
});

document.getElementById("btnLogout").addEventListener("click", async () => {
  try{ if(auth) await auth.signOut(); }catch(e){}
  clearSession();
  renderSession(null);
  showMsg("Sessão terminada.", true);
});

/* Boot */
initFirebase();
renderSession(getSession());

/* Helper: guardar config Firebase a partir da consola do browser:
   localStorage.setItem("pv_firebase_apiKey","...");
   localStorage.setItem("pv_firebase_authDomain","....firebaseapp.com");
   localStorage.setItem("pv_firebase_projectId","...");
   localStorage.setItem("pv_firebase_appId","...");
   location.reload();
*/
</script>
</body>
</html>
