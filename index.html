<style>
:root{--bg:#0a0c10;--surface:#12161c;--surface-2:#181d25;--surface-3:#222831;--border:#2a313c;--text:#f0f3f6;--text-secondary:#9aa3ad;--text-muted:#6b7380;--accent:#2f81f7;--accent-soft:rgba(47,129,247,.12);--tag:#f43f5e;--font:"Inter",system-ui,sans-serif;--max:720px}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}a{color:inherit;text-decoration:none}img{max-width:100%;display:block}button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}.wrap{width:min(var(--max),100% - 1.5rem);margin:0 auto}
.header{position:sticky;top:0;z-index:100;background:rgba(10,12,16,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.header-inner{display:flex;align-items:center;gap:12px;padding:12px 0;min-height:56px}
.brand{font-weight:800;font-size:17px;display:flex;align-items:center;gap:6px}.brand span{background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px}
.nav-links{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav-links a{font-size:12px;font-weight:600;padding:7px 11px;border-radius:8px;color:var(--text-secondary)}
.nav-links a.on{color:#fff;background:var(--accent)}.nav-links a.trailers{color:#fff;background:#bf3989}.nav-links a.reels{color:#fff;background:#7c3aed}
.hero{margin:1.25rem 0 1.5rem;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:var(--surface);position:relative;cursor:pointer}
.hero-img{aspect-ratio:16/10;background:var(--surface-3) center/cover no-repeat;position:relative}
.hero-img::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(10,12,16,.95),transparent 60%)}
.hero-body{position:absolute;left:0;right:0;bottom:0;padding:1.25rem;z-index:1}
.hero-tag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;color:#fff;background:var(--tag);padding:4px 8px;border-radius:4px;margin-bottom:8px}
.hero-title{font-size:1.35rem;font-weight:800;line-height:1.25;margin-bottom:6px}.hero-meta{font-size:12px;color:var(--text-secondary)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{font-size:12px;font-weight:600;padding:6px 12px;border-radius:100px;border:1px solid var(--border);background:var(--surface);color:var(--text-secondary)}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.api-status{font-size:11px;color:var(--text-muted);padding:8px 0}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:1.5rem 0 .85rem}
.sec-title{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.news-item{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--border);cursor:pointer}
.news-thumb{width:96px;height:72px;border-radius:8px;overflow:hidden;background:var(--surface-3)}
.news-thumb img{width:100%;height:100%;object-fit:cover}
.news-cat{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--tag);margin-bottom:4px}
.news-title{font-size:15px;font-weight:700;line-height:1.3;margin-bottom:4px}.news-item:hover .news-title{color:var(--accent)}
.news-date{font-size:11px;color:var(--text-muted)}
.suggest-card{display:grid;grid-template-columns:88px 1fr;border-radius:10px;overflow:hidden;background:#b45309;color:#fff;min-height:88px;margin-bottom:10px}
.suggest-card img{width:88px;min-height:88px;object-fit:cover}.suggest-body{padding:12px 14px}
.suggest-label{font-size:10px;font-weight:700;opacity:.85;margin-bottom:4px}.suggest-title{font-size:14px;font-weight:700}
.overlay{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.75);display:none;align-items:flex-start;justify-content:center;padding:20px 12px;overflow-y:auto}
.overlay.open{display:flex}.sheet{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:min(640px,100%);margin:auto;position:relative}
.sheet-close{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);font-size:18px;display:grid;place-items:center}
.sheet-cover{aspect-ratio:16/9;background:var(--surface-3) center/cover no-repeat;border-radius:12px 12px 0 0}
.sheet-body{padding:1.25rem}.sheet-cat{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--tag);margin-bottom:8px}
.sheet-title{font-size:1.35rem;font-weight:800;margin-bottom:8px;padding-right:28px}.sheet-meta{font-size:12px;color:var(--text-muted);margin-bottom:14px}
.sheet-text{font-size:14px;color:var(--text-secondary);line-height:1.65;white-space:pre-line}
.sheet-person{display:flex;align-items:center;gap:12px;margin:16px 0;padding:12px;background:var(--surface-2);border-radius:10px;border:1px solid var(--border)}
.sheet-person img{width:56px;height:56px;border-radius:50%;object-fit:cover}
.footer{margin-top:2.5rem;border-top:1px solid var(--border);background:var(--surface);padding:1.75rem 0}.footer a{display:block;font-size:13px;color:var(--text-secondary);margin-bottom:4px}
.empty{text-align:center;padding:2rem;color:var(--text-muted);border:1px dashed var(--border);border-radius:10px}
</style>

<body>

<script>
const NEWS_ARCHIVE_KEY="pv_news_archive",NEWS_API_TS="pv_news_api_ts",NEWS_DAY_MS=86400000;
const SEED_NEWS=[
{id:"2026-11-04-indie",title:"De estúdio solo a lançamento global: RPG independente",category:"Fundadores",date:"2026-11-04",source:"PLAYVERSE",image:"https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=800&q=80",person:{name:"Ana Ribeiro",role:"Fundadora · Pixel Harbor",photo:"https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=200&q=80"},summary:"Early access do primeiro título comercial.",body:"Ana Ribeiro fundou a Pixel Harbor com um RPG narrativo em português e inglês. O jogo entra em early access esta semana."},
{id:"2026-11-03-maputo",title:"Estúdio em Maputo anuncia primeiro jogo de ação",category:"Estúdios",date:"2026-11-03",source:"PLAYVERSE",image:"https://images.unsplash.com/photo-1511512578047-dfb367046420?w=800&q=80",person:{name:"Carlos Mendes",role:"Diretor criativo · Baobab Games",photo:"https://images.unsplash.com/photo-1560250097-0b93528c311a?w=200&q=80"},summary:"Elenco criativo e trailer em breve.",body:"A Baobab Games, em Maputo, revelou o elenco do seu primeiro título de ação com cenários inspirados na costa moçambicana."},
{id:"2026-11-02-launch",title:"Lançamento: indie de corridas com suporte a volante",category:"Lançamentos",date:"2026-11-02",source:"PLAYVERSE",image:"https://images.unsplash.com/photo-1511919884226-fd3cad54643b?w=800&q=80",person:{name:"João Silva",role:"Fundador · Apex Lane",photo:"https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=200&q=80"},summary:"Oito pistas no dia um.",body:"João Silva lançou o simulador da Apex Lane. Trailers na secção Trailers."},
{id:"2026-11-01-ind",title:"Fundadores usam trailers curtos para validar ideias",category:"Indústria",date:"2026-11-01",source:"PLAYVERSE",image:"https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?w=800&q=80",person:null,summary:"Protótipos em vídeo de 30–60s.",body:"Fundadores publicam trailers de protótipo antes de investir um ano de produção."},
{id:"2026-10-30-surv",title:"Fundadora revela personagem do survival narrativo",category:"Fundadores",date:"2026-10-30",source:"PLAYVERSE",image:"https://images.unsplash.com/photo-1542751371-adc38448a05e?w=800&q=80",person:{name:"Marta Costa",role:"Game designer · North Lantern",photo:"https://images.unsplash.com/photo-1580489944761-15a19d654956?w=200&q=80"},summary:"Sistema de stress e mapa semi-aberto.",body:"Marta Costa partilhou arte do protagonista do survival da North Lantern."},
{id:"2026-10-28-pv",title:"PLAYVERSE: notícias de quem cria jogos e trailers",category:"Indústria",date:"2026-10-28",source:"PLAYVERSE",image:"https://images.unsplash.com/photo-1552820728-8b83bb6b773f?w=800&q=80",person:null,summary:"Notícias na home, trailers na secção Trailers.",body:"A PLAYVERSE junta histórias de fundadores ao catálogo de trailers. O arquivo de notícias só cresce."}
];
const SUGGEST=[{title:"Trailers oficiais e fichas",label:"// PLAYVERSE SUGERE //",href:"trailers.html",image:"https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=400&q=80"},{title:"Reels — trailers verticais",label:"// PLAYVERSE SUGERE //",href:"reels.html",image:"https://images.unsplash.com/photo-1511512578047-dfb367046420?w=400&q=80"},{title:"WhatsApp Publisher Moçambique",label:"// PLAYVERSE SUGERE //",href:"https://wa.me/258859573853",image:"https://images.unsplash.com/photo-1611746872915-64382b5c76da?w=400&q=80"}];
let currentCat="Todas",archive=[];
function loadArchive(){try{return JSON.parse(localStorage.getItem(NEWS_ARCHIVE_KEY)||"[]")}catch(e){return[]}}
function saveArchive(list){try{localStorage.setItem(NEWS_ARCHIVE_KEY,JSON.stringify(list))}catch(e){}}
function mergeNews(){const m=new Map();SEED_NEWS.forEach(n=>m.set(n.id,n));archive.forEach(n=>{if(n&&n.id)m.set(n.id,Object.assign({},m.get(n.id)||{},n))});return Array.from(m.values()).sort((a,b)=>String(b.date).localeCompare(String(a.date)))}
function appendNews(items){if(!items||!items.length)return 0;const have=new Set(mergeNews().map(n=>n.id));let added=0;const extra=[];items.forEach(n=>{if(n&&n.id&&!have.has(n.id)){extra.push(n);have.add(n.id);added++}});if(added){const all=mergeNews().concat(extra);const m=new Map();all.forEach(n=>m.set(n.id,n));saveArchive(Array.from(m.values()).sort((a,b)=>String(b.date).localeCompare(String(a.date))));archive=loadArchive()}return added}
function formatDate(iso){if(!iso)return"";const[s]=[String(iso).slice(0,10)];const[y,m,d]=s.split("-");return(y&&m&&d)?d+"/"+m+"/"+y:iso}
function filtered(){const all=mergeNews();if(currentCat==="Todas")return all;if(currentCat==="API")return all.filter(n=>n.fromApi);return all.filter(n=>n.category===currentCat)}
function renderHero(){const list=mergeNews(),hero=document.getElementById("hero");if(!list.length){hero.hidden=true;return}const n=list[0];hero.hidden=false;document.getElementById("heroImg").style.backgroundImage="url("+(n.image||"")+")";document.getElementById("heroTag").textContent=n.category||"Destaque";document.getElementById("heroTitle").textContent=n.title;document.getElementById("heroMeta").textContent=formatDate(n.date)+(n.person?" · "+n.person.name:(n.source?" · "+n.source:""));hero.onclick=()=>openArticle(n.id)}
function renderList(){const list=filtered(),el=document.getElementById("newsList"),empty=document.getElementById("newsEmpty");document.getElementById("newsCount").textContent=list.length+" notícia"+(list.length!==1?"s":"");el.innerHTML="";if(!list.length){empty.style.display="";return}empty.style.display="none";list.forEach(n=>{const a=document.createElement("article");a.className="news-item";a.innerHTML='<div class="news-thumb">'+(n.image?'<img src="'+n.image+'" alt="" loading="lazy">':'')+'</div><div><div class="news-cat">// '+(n.category||"Notícia")+' //</div><h3 class="news-title"></h3><div class="news-date"></div></div>';a.querySelector(".news-title").textContent=n.title;a.querySelector(".news-date").textContent=formatDate(n.date)+(n.person?" · "+n.person.name:(n.source?" · "+n.source:""));a.onclick=()=>openArticle(n.id);el.appendChild(a)})}
function renderSuggest(){document.getElementById("suggestList").innerHTML=SUGGEST.map(s=>'<a class="suggest-card" href="'+s.href+'"'+(s.href.startsWith("http")?' target="_blank" rel="noopener"':'')+'><img src="'+s.image+'" alt="" loading="lazy"><div class="suggest-body"><div class="suggest-label">'+s.label+'</div><div class="suggest-title">'+s.title+'</div></div></a>').join("")}
function openArticle(id){const n=mergeNews().find(x=>x.id===id);if(!n)return;document.getElementById("articleCover").style.backgroundImage="url("+(n.image||"")+")";document.getElementById("articleCat").textContent="// "+(n.category||"Notícia")+" //";document.getElementById("articleTitle").textContent=n.title;document.getElementById("articleMeta").textContent=formatDate(n.date)+(n.summary?" · "+n.summary:"");document.getElementById("articleText").textContent=n.body||n.summary||"";const person=document.getElementById("articlePerson");if(n.person){person.hidden=false;document.getElementById("articlePersonImg").src=n.person.photo||"";document.getElementById("articlePersonName").textContent=n.person.name||"";document.getElementById("articlePersonRole").textContent=n.person.role||""}else person.hidden=true;document.getElementById("articleModal").classList.add("open");document.body.style.overflow="hidden"}
function closeArticle(){document.getElementById("articleModal").classList.remove("open");document.body.style.overflow=""}
document.getElementById("articleClose").onclick=closeArticle;document.getElementById("articleModal").onclick=e=>{if(e.target.id==="articleModal")closeArticle()};
document.querySelectorAll("#chips .chip").forEach(btn=>{btn.onclick=()=>{document.querySelectorAll("#chips .chip").forEach(c=>c.classList.remove("on"));btn.classList.add("on");currentCat=btn.dataset.cat;renderList()}});
async function fetchApiNews(force){const status=document.getElementById("apiStatus");const ts=+localStorage.getItem(NEWS_API_TS)||0;if(!force&&Date.now()-ts<NEWS_DAY_MS){status.textContent="Feed API em cache (24h). Arquivo: "+mergeNews().length;return}status.textContent="A atualizar feed API…";const key=localStorage.getItem("pv_rawg_key")||"47531b491b544f4fa2bd5588869d9402";try{const r=await fetch("https://api.rawg.io/api/games?ordering=-released&page_size=12&metacritic=60,100&key="+encodeURIComponent(key));if(!r.ok)throw new Error("HTTP "+r.status);const data=await r.json();const items=(data.results||[]).map(g=>{const date=(g.released||"").slice(0,10)||new Date().toISOString().slice(0,10);const genres=(g.genres||[]).map(x=>x.name);return{id:"rawg-"+g.id+"-"+date,title:g.name+(g.released?" — lançamento "+date:""),category:genres.some(x=>/indie/i.test(x))?"Estúdios":"Lançamentos",date,source:"RAWG",fromApi:true,image:g.background_image||"",person:null,summary:"★ "+(g.rating||"—")+" · "+genres.slice(0,3).join(", "),body:(g.name||"Jogo")+" nos lançamentos recentes. Vê trailers na secção Trailers.",url:"trailers.html"}});const added=appendNews(items);localStorage.setItem(NEWS_API_TS,String(Date.now()));status.textContent=(added?"Feed API: +"+added+" novas. ":"Sem novidades. ")+"Arquivo: "+mergeNews().length;renderHero();renderList()}catch(err){status.textContent="Feed API indisponível — arquivo local ("+mergeNews().length+")"}}
document.addEventListener("DOMContentLoaded",()=>{archive=loadArchive();appendNews(SEED_NEWS);archive=loadArchive();renderHero();renderList();renderSuggest();fetchApiNews(false)});
window.PLAYVERSE_NEWS={appendNews,mergeNews,fetchApiNews};
</script>
